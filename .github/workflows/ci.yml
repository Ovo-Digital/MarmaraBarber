name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore src/backend/HeadlessCommerce.sln
      - run: dotnet build src/backend/HeadlessCommerce.sln --no-restore
      - run: dotnet test src/backend/HeadlessCommerce.sln --no-build --verbosity normal
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/storefront-next/package-lock.json
      - run: npm ci
        working-directory: src/frontend/storefront-next
      - run: npm run build
        working-directory: src/frontend/storefront-next
        env:
          NEXT_PUBLIC_BFF_URL: http://localhost:8080
