services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_Strong_Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      SQL_CONNECTION: ${SQL_CONNECTION:-Server=sqlserver,1433;Database=HeadlessCommerce;User Id=sa;Password=Your_Strong_Passw0rd!;TrustServerCertificate=True;}
      REDIS_CONNECTION: ${REDIS_CONNECTION:-redis:6379}
      SHOPIFY_STORE_URL: ${SHOPIFY_STORE_URL}
      SHOPIFY_STOREFRONT_TOKEN: ${SHOPIFY_STOREFRONT_TOKEN}
      SHOPIFY_ADMIN_TOKEN: ${SHOPIFY_ADMIN_TOKEN}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2025-01}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-https://headless-commerce.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-headless-commerce-clients}
      ERP_PROVIDER: ${ERP_PROVIDER:-Nebim}
      CRM_PROVIDER: ${CRM_PROVIDER:-Hubspot}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:-http://localhost:8080}
        NEXT_PUBLIC_SHOPIFY_STORE_URL: ${NEXT_PUBLIC_SHOPIFY_STORE_URL}
        NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN}
        NEXT_PUBLIC_SHOPIFY_API_VERSION: ${NEXT_PUBLIC_SHOPIFY_API_VERSION:-2025-01}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlserver_data:
  redis_data:
